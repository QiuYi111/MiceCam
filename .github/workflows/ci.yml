name: CI

on:
  push:
    branches: [main, plugin-system, feat/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            build_ui: ON
          - os: macos-14
            build_ui: ON
          - os: windows-2022
            build_ui: OFF

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ====== Linux ======
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev libswscale-dev \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window \
            libspdlog-dev nlohmann-json3-dev libgtest-dev pkg-config \
            libprotobuf-dev protobuf-compiler protobuf-compiler-grpc libgrpc++-dev libgrpc-dev
          cd /usr/src/gtest && sudo cmake -B build && sudo cmake --build build && sudo cmake --install build --prefix /usr/local

      # ====== macOS ======
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg protobuf grpc qt@6 spdlog nlohmann-json googletest pkg-config
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> $GITHUB_ENV

      # ====== Windows (MSYS2 UCRT64 — all prebuilt binaries) ======
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-protobuf
            mingw-w64-ucrt-x86_64-grpc
            mingw-w64-ucrt-x86_64-spdlog
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-gtest

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SPIKE=OFF \
            -DBUILD_UI=${{ matrix.build_ui }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --config Release -j

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cd build && ctest --output-on-failure -C Release --exclude-regex '.*hil.*|.*stress.*|.*stream_liveness.*'

      # ====== Configure & Build (Unix) ======
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SPIKE=OFF \
            -DBUILD_UI=${{ matrix.build_ui }}

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --config Release -j

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: cd build && ctest --output-on-failure -C Release --exclude-regex '.*hil.*|.*stress.*|.*stream_liveness.*'

      # ====== Artifacts ======
      - name: Upload binary (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: micecam-macos-arm64
          path: build/cmd/micecam_ui/micecam_ui

      - name: Upload binary (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: micecam-linux-x64
          path: build/cmd/micecam_ui/micecam_ui
