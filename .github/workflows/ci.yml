name: CI

on:
  push:
    branches: [main, plugin-system]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (macOS)
        run: brew install ffmpeg protobuf grpc spdlog nlohmann-json googletest
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --exclude-regex '.*hil.*|.*stress.*'

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (vcpkg)
        run: vcpkg install ffmpeg protobuf grpc spdlog nlohmann-json gtest
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_UI=OFF -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake
        shell: cmd
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release --exclude-regex '.*hil.*|.*stress.*'

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libprotobuf-dev protobuf-compiler \
            libgrpc++-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libgtest-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_UI=OFF
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --exclude-regex '.*hil.*|.*stress.*'
