name: MiceCam CI

on:
  push:
    branches: [ "main", "master", "feat/*", "fix/*", "feature/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macos'
        run: |
          brew install pkg-config nasm autoconf automake libtool autoconf-archive ninja

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config nasm autoconf autoconf-archive automake libtool ninja-build

      - name: Export GitHub Actions Cache Environment Variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 1e199d32ad53aab1defda61ce41c380302e3f95c
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Configure CMake
        shell: bash
        run: |
          VCPKG_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_TOOLCHAIN_FILE" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=ON

      - name: Build C++ and Bindings
        shell: bash
        run: |
          cmake --build build --config Release

      - name: Install Python Dependencies
        run: uv sync --all-extras

      - name: Run C++ Tests
        shell: bash
        run: |
          cd build && ctest --output-on-failure -C Release

      - name: Build Python Package
        shell: bash
        run: |
          uv build

      - name: Package EXE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv pip install pyinstaller
          $PydFile = Get-ChildItem -Path "build" -Filter "micecam*.pyd" -Recurse | Select-Object -First 1
          if ($null -eq $PydFile) {
            Write-Error "Could not find micecam.pyd"
            exit 1
          }
          echo "Found .pyd at $($PydFile.FullName)"

          # 1. Build Worker EXE
          uv run pyinstaller --noconsole --clean `
            --add-data "$($PydFile.FullName);internal/micecam" `
            --name "MiceCamWorker" `
            --distpath "dist/windows_exe/MiceCam/tools" `
            cmd/gui/recorder_worker.py

          # 2. Build GUI EXE
          uv run pyinstaller --noconsole --clean `
            --add-data "$($PydFile.FullName);internal/micecam" `
            --name "MiceCam" `
            --distpath "dist/windows_exe" `
            cmd/gui/gui/main_window.py

      - name: Build MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          heat dir "dist/windows_exe/MiceCam" -dr INSTALLFOLDER -cg ProductComponents -gg -sreg -sfrag -srd -out "packaging/windows/components.wxs"
          candle packaging/windows/micecam.wxs packaging/windows/components.wxs -o packaging/windows/
          light packaging/windows/micecam.wixobj packaging/windows/components.wixobj -o "dist/MiceCam-Installer.msi"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: micecam-${{ runner.os }}-py${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.msi
            dist/windows_exe/MiceCam/*.exe
