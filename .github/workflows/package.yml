name: Build and Package

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Initialize Environment
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Windows direct init logic
            if [ ! -d "vcpkg" ]; then
              git clone https://github.com/microsoft/vcpkg.git vcpkg
            fi
            ./vcpkg/bootstrap-vcpkg.sh
            uv sync --all-extras
          else
            # Linux/macOS use the project's 'make init'
            make init
          fi

      - name: Configure CMake
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            VCPKG_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
            cmake -B build -S . \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_TOOLCHAIN_FILE" \
              -DCMAKE_BUILD_TYPE=Release \
              -DWITH_PYTHON_BINDINGS=ON
          else
            # For Linux/macOS, we don't call cmake directly if we want to use 'make build'
            # However, 'make build' in the current Makefile handles its own cmake call.
            # We just need to ensure VCPKG_ROOT is set if the Makefile needs it,
            # but the Makefile seems to find it relative to CURDIR.
            true
          fi

      - name: Build C++ and Bindings
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cmake --build build --config Release -j$NUMBER_OF_PROCESSORS
          else
            make build
          fi

      - name: Install Python Dependencies
        run: uv sync --all-extras

      - name: Run C++ Tests
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cd build
            ctest --output-on-failure -C Release
          else
            make test
          fi

      - name: Build Python Package
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            uv build
          else
            make package
          fi

      - name: Package EXE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv pip install pyinstaller
          # Find the compiled .pyd file
          $PydFile = Get-ChildItem -Path "build" -Filter "micecam*.pyd" -Recurse | Select-Object -First 1
          if ($null -eq $PydFile) {
            Write-Error "Could not find micecam.pyd"
            exit 1
          }
          echo "Found .pyd at $($PydFile.FullName)"

          # 1. Build Worker EXE
          uv run pyinstaller --noconsole --clean `
            --add-data "$($PydFile.FullName);internal/micecam" `
            --name "MiceCamWorker" `
            --distpath "dist/windows_exe/MiceCam/tools" `
            cmd/gui/recorder_worker.py

          # 2. Build GUI EXE
          uv run pyinstaller --noconsole --clean `
            --add-data "$($PydFile.FullName);internal/micecam" `
            --name "MiceCam" `
            --distpath "dist/windows_exe" `
            cmd/gui/gui/main_window.py

      - name: Build MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # WiX Toolset is pre-installed on Windows runners
          # Step 1: Harvest files from PyInstaller output
          heat dir "dist/windows_exe/MiceCam" -dr INSTALLFOLDER -cg ProductComponents -gg -sreg -sfrag -srd -out "packaging/windows/components.wxs"

          # Step 2: Compile .wxs files
          candle packaging/windows/micecam.wxs packaging/windows/components.wxs -o packaging/windows/

          # Step 3: Link into MSI
          light packaging/windows/micecam.wixobj packaging/windows/components.wixobj -o "dist/MiceCam-Installer.msi"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: micecam-${{ runner.os }}-py${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.msi
            dist/windows_exe/MiceCam/*.exe
