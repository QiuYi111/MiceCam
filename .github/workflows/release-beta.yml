name: Beta Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version/tag, for example v0.1.0-beta.1"
        required: true
        type: string
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

jobs:
  package-unix:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: macos-14
            name: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev libswscale-dev \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window \
            libspdlog-dev nlohmann-json3-dev libgtest-dev pkg-config \
            libprotobuf-dev protobuf-compiler protobuf-compiler-grpc libgrpc++-dev libgrpc-dev
          cd /usr/src/gtest
          sudo cmake -B build
          sudo cmake --build build -j 2
          sudo cmake --install build --prefix /usr/local

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg protobuf grpc qt@6 spdlog nlohmann-json googletest pkg-config
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SPIKE=OFF \
            -DBUILD_UI=ON

      - name: Build
        run: cmake --build build --config Release -j 3

      - name: Test
        run: cd build && ctest --output-on-failure -C Release --exclude-regex '.*hil.*|.*stress.*|.*stream_liveness.*'

      - name: Stage native app package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/MiceCam-${{ matrix.name }}"
          mkdir -p "${STAGE}/bin" \
                   "${STAGE}/3rdParty/bundled_plugins/micecam.ffmpeg/bin" \
                   "${STAGE}/3rdParty/bundled_plugins/micecam.oak/bin"

          cp build/cmd/micecam_ui/micecam_ui "${STAGE}/MiceCam"
          cp 3rdParty/bundled_plugins/micecam.ffmpeg/plugin.json "${STAGE}/3rdParty/bundled_plugins/micecam.ffmpeg/plugin.json"
          cp 3rdParty/bundled_plugins/micecam.oak/plugin.json "${STAGE}/3rdParty/bundled_plugins/micecam.oak/plugin.json"

          cp build/cmd/plugins/micecam_ffmpeg/micecam_ffmpeg_plugin \
             "${STAGE}/3rdParty/bundled_plugins/micecam.ffmpeg/bin/micecam-ffmpeg"
          cp build/cmd/plugins/micecam_oak/micecam_oak_plugin \
             "${STAGE}/3rdParty/bundled_plugins/micecam.oak/bin/micecam-oak"

          cat > "${STAGE}/README-beta.txt" <<'EOF'
          MiceCam beta native package.

          Run ./MiceCam from this directory so bundled plugin discovery can find
          3rdParty/bundled_plugins. macOS DMG/.app packaging is the next beta
          validation gate.
          EOF

          chmod +x "${STAGE}/MiceCam" \
                   "${STAGE}/3rdParty/bundled_plugins/micecam.ffmpeg/bin/micecam-ffmpeg" \
                   "${STAGE}/3rdParty/bundled_plugins/micecam.oak/bin/micecam-oak"

          tar -C dist -czf "MiceCam-${{ matrix.name }}.tar.gz" "MiceCam-${{ matrix.name }}"

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/package_macos_dmg.sh
          scripts/package_macos_dmg.sh build dist "${GITHUB_REF_NAME#v}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MiceCam-${{ matrix.name }}
          path: |
            MiceCam-linux-x64.tar.gz
            dist/MiceCam-*-macos-arm64.dmg

  package-windows:
    name: Package windows-x64
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-protobuf
            mingw-w64-ucrt-x86_64-grpc
            mingw-w64-ucrt-x86_64-spdlog
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SPIKE=OFF \
            -DBUILD_UI=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release -j 3

      - name: Test
        shell: msys2 {0}
        run: cd build && ctest --output-on-failure -C Release --exclude-regex '.*hil.*|.*stress.*|.*stream_liveness.*'

      - name: Deploy Qt runtime
        shell: msys2 {0}
        run: |
          STAGE="dist/MiceCam"
          PREFIX="${MINGW_PREFIX}"
          mkdir -p "${STAGE}"
          cp build/cmd/micecam_ui/micecam_ui.exe "${STAGE}/MiceCam.exe"
          mkdir -p "${STAGE}/3rdParty/bundled_plugins/micecam.ffmpeg/bin"
          mkdir -p "${STAGE}/3rdParty/bundled_plugins/micecam.oak/bin"
          cp build/cmd/plugins/micecam_ffmpeg/micecam_ffmpeg_plugin.exe \
             "${STAGE}/3rdParty/bundled_plugins/micecam.ffmpeg/bin/micecam-ffmpeg.exe"
          cp build/cmd/plugins/micecam_oak/micecam_oak_plugin.exe \
             "${STAGE}/3rdParty/bundled_plugins/micecam.oak/bin/micecam-oak.exe"
          cp 3rdParty/bundled_plugins/micecam.ffmpeg/plugin.json \
             "${STAGE}/3rdParty/bundled_plugins/micecam.ffmpeg/plugin.json"
          cp 3rdParty/bundled_plugins/micecam.oak/plugin.json \
             "${STAGE}/3rdParty/bundled_plugins/micecam.oak/plugin.json"

          # qt.conf — tells Qt where to find plugins and QML imports
          cat > "${STAGE}/qt.conf" <<'QTCONF'
          [Paths]
          Plugins=.
          Qml2Imports=.
          QTCONF

          # Deploy Qt platform plugin
          mkdir -p "${STAGE}/platforms"
          PLATFORM_SRC="${PREFIX}/share/qt6/plugins/platforms/qwindows.dll"
          [ -f "${PLATFORM_SRC}" ] || PLATFORM_SRC="${PREFIX}/plugins/platforms/qwindows.dll"
          cp "${PLATFORM_SRC}" "${STAGE}/platforms/" 2>/dev/null || echo "Warning: qwindows.dll not found at expected paths"

          # Deploy Qt platform themes plugin
          mkdir -p "${STAGE}/platformthemes"
          THEME_SRC="${PREFIX}/share/qt6/plugins/platformthemes/qxdgdesktopportal.dll"
          [ -f "${THEME_SRC}" ] || THEME_SRC="${PREFIX}/plugins/platformthemes/qxdgdesktopportal.dll"
          cp "${THEME_SRC}" "${STAGE}/platformthemes/" 2>/dev/null || true

          # Deploy QML modules: copy all from MSYS2 Qt6 qml directory
          QML_SRC="${PREFIX}/share/qt6/qml"
          if [ ! -d "${QML_SRC}" ]; then
            QML_SRC="${PREFIX}/qml"
          fi
          echo "Copying QML modules from ${QML_SRC} ..."
          cp -r "${QML_SRC}/" "${STAGE}/"

          # Copy all transitive DLL dependencies via ldd
          bash scripts/copy_msys2_deps.sh "${STAGE}/MiceCam.exe" "${STAGE}" \
            "${STAGE}/3rdParty/bundled_plugins/micecam.ffmpeg/bin/micecam-ffmpeg.exe" \
            "${STAGE}/3rdParty/bundled_plugins/micecam.oak/bin/micecam-oak.exe"

          # Remove .gitignore, .qmlc, and other source artifacts from QML tree
          find "${STAGE}" -name '.gitignore' -delete 2>/dev/null || true
          find "${STAGE}" -name '*.qmlc' -delete 2>/dev/null || true
          find "${STAGE}" -name '*.jsc' -delete 2>/dev/null || true

          # Write README
          cat > "${STAGE}/README-beta.txt" <<'EOF'
          MiceCam native beta package.
          Extract this ZIP and run MiceCam.exe from the extracted directory.
          EOF

      - name: Package Windows ZIP
        shell: msys2 {0}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          ARCHIVE="MiceCam-${VERSION}-windows-x64.zip"
          cd dist
          7z a "${ARCHIVE}" MiceCam/ -mx=5
          mv "${ARCHIVE}" ..

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MiceCam-windows-x64
          path: MiceCam-*-windows-x64.zip

  publish:
    name: Publish beta prerelease
    needs:
      - package-unix
      - package-windows
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve beta version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MiceCam ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-artifacts/*
          body: |
            Beta release for multi-platform validation.

            Notes:
            - macOS artifact is a DMG containing a native .app bundle.
            - Windows artifact is a ZIP containing the native Qt/QML application plus official bundled plugins.
            - Linux artifact is a tarball containing the native UI binary plus official bundled plugins.
            - HIL/OAK hardware validation is expected to run outside GitHub-hosted runners.
