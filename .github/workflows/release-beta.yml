name: Beta Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version/tag, for example v0.1.0-beta.1"
        required: true
        type: string
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

jobs:
  package-unix:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: macos-14
            name: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev libswscale-dev \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window \
            libspdlog-dev nlohmann-json3-dev libgtest-dev pkg-config \
            libprotobuf-dev protobuf-compiler protobuf-compiler-grpc libgrpc++-dev libgrpc-dev
          cd /usr/src/gtest
          sudo cmake -B build
          sudo cmake --build build -j 2
          sudo cmake --install build --prefix /usr/local

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg protobuf grpc qt@6 spdlog nlohmann-json googletest pkg-config
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SPIKE=OFF \
            -DBUILD_UI=ON

      - name: Build
        run: cmake --build build --config Release -j 3

      - name: Test
        run: cd build && ctest --output-on-failure -C Release --exclude-regex '.*hil.*|.*stress.*|.*stream_liveness.*'

      - name: Stage native app package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/MiceCam-${{ matrix.name }}"
          mkdir -p "${STAGE}/bin" \
                   "${STAGE}/3rdParty/bundled_plugins/micecam.ffmpeg/bin" \
                   "${STAGE}/3rdParty/bundled_plugins/micecam.oak/bin"

          cp build/cmd/micecam_ui/micecam_ui "${STAGE}/MiceCam"
          cp 3rdParty/bundled_plugins/micecam.ffmpeg/plugin.json "${STAGE}/3rdParty/bundled_plugins/micecam.ffmpeg/plugin.json"
          cp 3rdParty/bundled_plugins/micecam.oak/plugin.json "${STAGE}/3rdParty/bundled_plugins/micecam.oak/plugin.json"

          cp build/cmd/plugins/micecam_ffmpeg/micecam_ffmpeg_plugin \
             "${STAGE}/3rdParty/bundled_plugins/micecam.ffmpeg/bin/micecam-ffmpeg"
          cp build/cmd/plugins/micecam_oak/micecam_oak_plugin \
             "${STAGE}/3rdParty/bundled_plugins/micecam.oak/bin/micecam-oak"

          cat > "${STAGE}/README-beta.txt" <<'EOF'
          MiceCam beta native package.

          Run ./MiceCam from this directory so bundled plugin discovery can find
          3rdParty/bundled_plugins. macOS DMG/.app packaging is the next beta
          validation gate.
          EOF

          chmod +x "${STAGE}/MiceCam" \
                   "${STAGE}/3rdParty/bundled_plugins/micecam.ffmpeg/bin/micecam-ffmpeg" \
                   "${STAGE}/3rdParty/bundled_plugins/micecam.oak/bin/micecam-oak"

          tar -C dist -czf "MiceCam-${{ matrix.name }}.tar.gz" "MiceCam-${{ matrix.name }}"

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/package_macos_dmg.sh
          scripts/package_macos_dmg.sh build dist "${GITHUB_REF_NAME#v}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MiceCam-${{ matrix.name }}
          path: |
            MiceCam-linux-x64.tar.gz
            dist/MiceCam-*-macos-arm64.dmg

  package-windows:
    name: Package windows-x64
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-protobuf
            mingw-w64-ucrt-x86_64-grpc
            mingw-w64-ucrt-x86_64-spdlog
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SPIKE=OFF \
            -DBUILD_UI=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release -j 3

      - name: Test
        shell: msys2 {0}
        run: cd build && ctest --output-on-failure -C Release --exclude-regex '.*hil.*|.*stress.*|.*stream_liveness.*'

      - name: Build native Windows MSI
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v',''
          if ($version -match '^(\d+)\.(\d+)\.(\d+)-beta\.(\d+)$') {
            $msiVersion = "$($Matches[1]).$($Matches[2]).$($Matches[4])"
          } else {
            $msiVersion = ($version -split '-')[0]
          }
          powershell -ExecutionPolicy Bypass -File .\scripts\package_windows_native_msi.ps1 `
            -BuildDir build `
            -DistDir dist `
            -Version $msiVersion

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MiceCam-windows-x64
          path: dist/MiceCam-*-windows-x64.msi

  publish:
    name: Publish beta prerelease
    needs:
      - package-unix
      - package-windows
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve beta version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MiceCam ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-artifacts/*
          body: |
            Beta release for multi-platform validation.

            Notes:
            - macOS artifact is a DMG containing a native .app bundle.
            - Windows artifact is a native Qt/QML MSI containing official bundled plugins.
            - Linux artifact is a tarball containing the native UI binary plus official bundled plugins.
            - HIL/OAK hardware validation is expected to run outside GitHub-hosted runners.
