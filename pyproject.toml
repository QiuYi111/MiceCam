[project]
name = "micecam"
version = "1.0.0"
description = "MiceCam SDK - High-speed camera acquisition library"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pybind11>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.11.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["internal"]
include = ["micecam*"]

